name: Deploy Book to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # AI consensus: pre-built binary = 15 sec vs 8 min from cargo install
      - name: Setup mdBook (pre-built binary)
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build mdBook
        run: mdbook build

      # Copy root landing page into the built site
      - name: Copy landing page into dist
        run: cp index.html book/index.html

      # Deploy both the landing page and the book reader to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
