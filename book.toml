[book]
authors = ["AI Book Engine"]
language = "en"
src = "src"
title = "100 Solopreneur Short Stories"
description = "Gripping, raw, unvarnished tales of solo founders building in silence."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
git-repository-url = "https://github.com/janny844/solopreneur-stories"
additional-css = ["src/custom.css"]
