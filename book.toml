[book]
authors = ["AI Book Engine"]
language = "en"
multilingual = false
src = "src"
title = "100 Solopreneur Short Stories"
description = "Gripping, raw, unvarnished tales of solo founders building in silence."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
git-repository-url = "https://github.com/YOUR_USERNAME/dynamic-book-generator"
additional-css = ["custom.css"]

[output.epub]
optional = true
